<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>

    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <table style="width: 75%;">
        <tr style="background-color: rgb(230, 227, 227);">
            <th style="width:25%">Product type</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>In Stock</th>
        </tr>
        <tr>
            <th>Cheese cake</th>
            <th>$3</th>
            <th>6</th>
            <th>YES</th>
        </tr>
        <tr>
            <th>Tiramisu</th>
            <th>$3.5</th>
            <th>6</th>
            <th>YES</th>
        </tr>
        <tr>
            <th>Cream puff</th>
            <th>$2</th>
            <th>10</th>
            <th>NO</th>
        </tr>
        <tr>
            <th>Cookie</th>
            <th>$1.5</th>
            <th>12</th>
            <th>YES</th>
        </tr>
    </table>

</body>
</html>
